<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Beginner notes on programming fundamentals, C, C++, JavaScript, algorithms, and data structures.">
  <title>First Steps in Programming</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      --border: #d0d7de;
      --code: #f6f8fa;
    }
    body { max-width: 62rem; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.6; }
    a { color: #0969da; }
    img { display: block; max-width: 100%; height: auto; margin: 1rem auto; }
    pre { overflow-x: auto; padding: 1rem; border-radius: 0.4rem; background: var(--code); }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    :not(pre) > code { padding: 0.15rem 0.35rem; border-radius: 0.25rem; background: var(--code); }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: 0.25rem solid var(--border); }
    table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    th, td { padding: 0.4rem 0.75rem; border: 1px solid var(--border); }
    .error { padding: 1rem; border: 1px solid #cf222e; border-radius: 0.4rem; }
    @media (prefers-color-scheme: dark) {
      :root { --border: #30363d; --code: #161b22; }
      a { color: #58a6ff; }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script defer>
    window.addEventListener("DOMContentLoaded", () => {
      const content = document.querySelector("#content");
      const allowedPages = new Set(["Readme.md", "Examples.md"]);
      const renderer = window.markdownit?.({ html: true, linkify: true, typographer: true });

      function selectedPage() {
        const requestedPage = new URLSearchParams(window.location.search).get("page");
        return allowedPages.has(requestedPage) ? requestedPage : "Readme.md";
      }

      async function renderPage(page) {
        content.innerHTML = "<p>Loading the programming guide…</p>";
        try {
          if (!renderer) throw new Error("Markdown renderer did not load");
          const response = await fetch(page);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          content.innerHTML = renderer.render(await response.text());
          document.title = content.querySelector("h1")?.textContent || "First Steps in Programming";
          window.scrollTo({ top: 0 });
        } catch (error) {
          content.innerHTML = `
            <div class="error">
              <h1>Unable to render the guide</h1>
              <p>Serve this directory through a web server instead of opening <code>index.html</code> directly.</p>
              <p>For example: <code>python3 -m http.server</code></p>
              <p><a href="${page}">Open the raw Markdown file</a></p>
            </div>`;
          console.error(error);
        }
      }

      content.addEventListener("click", event => {
        const link = event.target.closest("a");
        if (!link) return;

        const url = new URL(link.href, window.location.href);
        const page = url.pathname.split("/").pop();
        if (url.origin !== window.location.origin || !allowedPages.has(page)) return;

        event.preventDefault();
        const nextUrl = new URL(window.location.href);
        if (page === "Readme.md") nextUrl.searchParams.delete("page");
        else nextUrl.searchParams.set("page", page);
        window.history.pushState({ page }, "", nextUrl);
        renderPage(page);
      });

      window.addEventListener("popstate", () => renderPage(selectedPage()));
      renderPage(selectedPage());
    });
  </script>
</head>
<body>
  <main id="content" aria-live="polite">
    <p>Loading the programming guide…</p>
  </main>
  <noscript>This page requires JavaScript. <a href="Readme.md">Open the Markdown guide</a>.</noscript>
</body>
</html>
